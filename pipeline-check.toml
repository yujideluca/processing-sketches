# Limits for pipeline-check (github.com/yujideluca/pipeline-check). Changed only by Giovanni, in a commit that says why.
projeto = "processing-sketches"
aviso_a = 0.8

[gate]
command = "tools/quality_gate.sh"
required = true

[architecture]
pure_dirs = []

[[fitness]]
id = "gate-segundos"
kind = "gate_seconds"
limit = 300

[github]
repo = "yujideluca/processing-sketches"
branch = "main"
required_check = "gate"

[pre_push]
guard = []

[shellcheck]
extra_files = ["tools/hooks/pre-push"]
